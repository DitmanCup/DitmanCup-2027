name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 9 * * *'   # una vez por dia
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/supabase-keepalive.js
