name: Actualizar donadores

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      test_discord:
        description: 'Mandar a Discord el mensaje con el prizepool actual (para probar el webhook)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leer donaciones de Matcherino
        shell: pwsh
        run: ./scripts/update-donors.ps1
      - name: Commit si cambio algo
        id: commit
        run: |
          if [ -n "$(git status --porcelain data/donors.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/donors.json
            git commit -m "Actualizar donadores de Matcherino"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Despues del push (si fallara, no se avisa dos veces). Sin el secreto DISCORD_WEBHOOK_URL no hace nada.
      - name: Avisar en Discord si hay donaciones nuevas
        if: steps.commit.outputs.changed == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          git show HEAD~1:data/donors.json > "$RUNNER_TEMP/donors-old.json"
          node scripts/notify-discord-donation.js "$RUNNER_TEMP/donors-old.json" data/donors.json
      # Solo a mano (Run workflow -> test_discord): sin archivo anterior, toda donacion cuenta como nueva
      - name: Mensaje de prueba a Discord
        if: ${{ github.event.inputs.test_discord == 'true' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/notify-discord-donation.js none data/donors.json
