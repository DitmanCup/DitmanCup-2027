name: Actualizar vivos (YouTube y Kick)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ver quien esta en vivo en YouTube y Kick
        run: node scripts/update-live-status.js
      - name: Commit si cambio algo
        run: |
          if [ -n "$(git status --porcelain data/live-status.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/live-status.json
            git commit -m "Actualizar vivos de YouTube y Kick"
            git pull --rebase origin main
            git push
          fi
