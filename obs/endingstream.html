<html lang="en"><head><meta charset="utf-8"><title>Ending stream (OBS)</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=block">
<link rel="stylesheet" href="obs.css">
</head>
<body class="scene">
<ol class="list bare donors" id="list"></ol>
<div class="streams" id="streams"></div>
<div class="prize"><span class="amt gold" id="amt"></span></div>
<script src="obs.js"></script>
<script src="top-donors.js"></script>
<script src="prize-pool.js"></script>
<script src="next-streams.js"></script>
</body></html>
